<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Prompt Library for Teachers has moved</title>
  <meta name="description" content="This library is now part of Maths Prompt Studio.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#102a43">
  <meta http-equiv="refresh" content="0; url=https://yosoyun.github.io/math-prompt-studio/">
  <link rel="canonical" href="https://yosoyun.github.io/math-prompt-studio/">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #eef5f7;
      color: #102a43;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 12% 18%, rgba(42, 157, 143, .20), transparent 34rem),
        radial-gradient(circle at 88% 82%, rgba(244, 162, 97, .18), transparent 30rem),
        #eef5f7;
    }
    main {
      width: min(680px, 100%);
      padding: clamp(30px, 7vw, 56px);
      border: 1px solid rgba(16, 42, 67, .12);
      border-radius: 28px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 24px 70px rgba(16, 42, 67, .14);
      text-align: center;
    }
    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: #102a43;
      color: #fff;
      font-family: Georgia, serif;
      font-size: 40px;
      line-height: 1;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: #2a7f78;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 7vw, 54px);
      line-height: 1.04;
      letter-spacing: -.035em;
    }
    .message {
      margin: 24px auto 0;
      max-width: 510px;
      color: #486581;
      font-size: clamp(17px, 3vw, 20px);
      line-height: 1.7;
    }
    .message span { display: block; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      margin-top: 30px;
      padding: 0 24px;
      border-radius: 999px;
      background: #e76f51;
      color: #fff;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(231, 111, 81, .25);
    }
    a:hover { background: #cf5d41; }
    a:focus-visible { outline: 4px solid rgba(42, 157, 143, .35); outline-offset: 4px; }
    .note { margin: 18px 0 0; color: #829ab1; font-size: 13px; }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <div class="mark" aria-hidden="true">∑</div>
    <p class="eyebrow">A new home</p>
    <h1 id="page-title">The library has moved</h1>
    <p class="message">
      <span>This library merged into Maths Prompt Studio.</span>
      <span lang="hi">यह लाइब्रेरी Maths Prompt Studio में विलय हो गई है।</span>
    </p>
    <a href="https://yosoyun.github.io/math-prompt-studio/">Open Maths Prompt Studio&nbsp; →</a>
    <p class="note">If you are not redirected automatically, use the link above.</p>
  </main>
</body>
</html>
